apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: bankapp-network-policy
  namespace: dev
spec:
  podSelector:
    matchLabels:
      app: bankapp
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Permit traffic from the ingress-nginx controller namespace.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 80
  egress:
    # Permit DNS lookups.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Permit MySQL access to the database pod in this namespace.
    - to:
        - podSelector:
            matchLabels:
              app: app-database
      ports:
        - protocol: TCP
          port: 3306
